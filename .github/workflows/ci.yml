name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and build dependencies
        run: python -m pip install 'paramiko>=2.11,<5' 'packaging>=21' build twine 'mypy==2.3.1'
      - name: Test source
        run: python tools/run_checks.py
      - name: Check public type contracts
        run: python tools/check_public_types.py
      - name: Build and verify installed release
        run: python tools/check_release.py --output '${{ runner.temp }}/verified-artifacts'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sshscript-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/verified-artifacts/

  baseline-examples:
    name: Published 3.1.5 examples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install 'sshscript==3.1.5'
      - run: python -I tools/check_baseline_examples.py

  openssh-integration:
    name: OpenSSH integration (Python ${{ matrix.python-version }}, ${{ matrix.dependency-label }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.11'
            paramiko: 'paramiko==2.11.0'
            dependency-label: minimum
          - python-version: '3.14'
            paramiko: 'paramiko==2.11.0'
            dependency-label: minimum-new-python
          - python-version: '3.11'
            paramiko: 'paramiko>=3,<4'
            dependency-label: 3.x
          - python-version: '3.14'
            paramiko: 'paramiko>=4,<5'
            dependency-label: 4.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and build dependencies
        run: python -m pip install "${{ matrix.paramiko }}" 'packaging>=21' build twine
      - name: Test source with selected Paramiko
        run: python tools/run_checks.py
      - name: Build and verify wheel
        run: python tools/check_release.py --output "$RUNNER_TEMP/verified-artifacts"
      - name: Install verified wheel
        run: python -m pip install --force-reinstall "$RUNNER_TEMP"/verified-artifacts/*.whl "${{ matrix.paramiko }}"
      - name: Provision loopback OpenSSH server
        run: bash tools/setup_openssh_ci.sh "$GITHUB_ENV"
      - name: Test installed wheel against OpenSSH
        run: |
          mkdir -p "$RUNNER_TEMP/openssh-tests"
          TEST_SOURCE=unittest/test_openssh_integration.py
          if [[ -d src/sshscript ]]; then TEST_SOURCE=src/sshscript/unittest/test_openssh_integration.py; fi
          cp "$TEST_SOURCE" "$RUNNER_TEMP/openssh-tests/"
          cd "$RUNNER_TEMP/openssh-tests"
          python -I test_openssh_integration.py -v
      - name: Verify native su/sudo contracts on local and SSH backends
        run: python tools/run_native_auth_ci.py --wheel "$RUNNER_TEMP"/verified-artifacts/*.whl --report "$RUNNER_TEMP/native-auth-report.json"
      - name: Save native authentication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-auth-python-${{ matrix.python-version }}-${{ matrix.dependency-label }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/native-auth-report.json
      - name: Upload OpenSSH server log
        if: ${{ failure() && env.SSHSCRIPT_OPENSSH_LOG != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openssh-log-python-${{ matrix.python-version }}-${{ matrix.dependency-label }}
          if-no-files-found: warn
          path: ${{ env.SSHSCRIPT_OPENSSH_LOG }}
      - name: Remove disposable OpenSSH state
        if: always()
        run: |
          if [[ -n "${SSHSCRIPT_OPENSSH_PID_FILE:-}" && -s "$SSHSCRIPT_OPENSSH_PID_FILE" ]]; then
            sudo kill "$(cat "$SSHSCRIPT_OPENSSH_PID_FILE")" || true
          fi
          if [[ -n "${SSHSCRIPT_OPENSSH_SUDOERS:-}" ]]; then
            sudo rm -f "$SSHSCRIPT_OPENSSH_SUDOERS"
          fi
          if [[ -n "${SSHSCRIPT_OPENSSH_USER:-}" ]]; then
            sudo userdel -r "$SSHSCRIPT_OPENSSH_USER" 2>/dev/null || true
          fi
          if [[ -n "${SSHSCRIPT_OPENSSH_TARGET_USER:-}" ]]; then
            sudo userdel -r "$SSHSCRIPT_OPENSSH_TARGET_USER" 2>/dev/null || true
          fi
          if [[ -n "${SSHSCRIPT_OPENSSH_ROOT:-}" && "$SSHSCRIPT_OPENSSH_ROOT" == "$RUNNER_TEMP"/sshscript-openssh.* ]]; then
            sudo rm -rf -- "$SSHSCRIPT_OPENSSH_ROOT"
          fi

  # Preserve the required-check names configured on the protected release branch.
  # Both gates require every supported Python/Paramiko integration leg to pass.
  openssh-required-311:
    name: OpenSSH integration (Python 3.11)
    needs: openssh-integration
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.openssh-integration.result }}" = success

  openssh-required-314:
    name: OpenSSH integration (Python 3.14)
    needs: openssh-integration
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.openssh-integration.result }}" = success
