name: Documentation

on:
  push:
    branches:
      - gh-pages
  pull_request:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  validate:
    name: Validate and build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Validate documentation source
        run: python3 tools/check_docs.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build the Jekyll site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: .
          destination: ./_site

      - name: Verify key generated pages
        run: |
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/v3a/index.html
