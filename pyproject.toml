[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sshscript"
dynamic = ["version"]
description = "Python automation for local processes, SSH, and SSHScript .spy files"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "automation",
  "paramiko",
  "remote-execution",
  "sftp",
  "ssh",
  "subprocess",
  "system-administration",
]
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
  {name = "Yeh, Hsin-Yuan", email = "iapyeh@gmail.com"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "paramiko>=2.11,<5",
  "packaging>=21",
]

[project.urls]
Homepage = "https://github.com/iapyeh/sshscript"
Documentation = "https://iapyeh.github.io/sshscript/v3a/"
Changelog = "https://github.com/iapyeh/sshscript/blob/release/CHANGELOG.md"
Releases = "https://github.com/iapyeh/sshscript/releases"
Source = "https://github.com/iapyeh/sshscript"
Issues = "https://github.com/iapyeh/sshscript/issues"
Security = "https://github.com/iapyeh/sshscript/security/policy"
Support = "https://github.com/iapyeh/sshscript/discussions"

[project.scripts]
sshscript = "sshscript.sshscript:main"

[tool.setuptools]
packages = ["sshscript"]
include-package-data = false
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "sshscript._version.__version__"}
